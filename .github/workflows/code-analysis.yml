name: code-analysis

on:
  workflow_call:
    inputs:
      run-detekt:
        description: "Run Detekt static analysis job"
        required: false
        type: boolean
        default: true
      run-codeql:
        description: "Run CodeQL security scan job"
        required: false
        type: boolean
        default: true
      detekt-task:
        description: "Gradle task for Detekt"
        required: false
        type: string
        default: "detektAll"
      java-version:
        description: "JDK major version"
        required: false
        type: string
        default: "17"
  workflow_dispatch:
    inputs:
      run-detekt:
        description: "Run Detekt"
        required: false
        type: boolean
        default: true
      run-codeql:
        description: "Run CodeQL"
        required: false
        type: boolean
        default: true
      detekt-task:
        description: "Detekt Gradle task"
        required: false
        type: string
        default: "detektAll"
      java-version:
        description: "JDK major version"
        required: false
        type: string
        default: "17"

concurrency:
  group: code-analysis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  detekt:
    name: Detekt Analysis
    if: ${{ inputs.run-detekt }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ !contains(fromJson('["refs/heads/master","refs/heads/develop","refs/heads/staging"]'), github.ref) }}

      - name: Run detekt on all modules
        run: ./gradlew ${{ inputs.detekt-task }} --no-daemon --continue

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: "**/build/reports/detekt/"
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload detekt SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .
          category: detekt
        continue-on-error: true

  codeql:
    name: CodeQL Analysis
    if: ${{ inputs.run-codeql }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: "temurin"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-kotlin
