name: ci-mobile

on:
  pull_request:
    branches: ["master", "develop", "staging"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options:
          - development
          - test
          - staging
          - production
        default: development
      build_android:
        description: "Build Android"
        type: boolean
        default: true
      build_ios:
        description: "Build iOS"
        type: boolean
        default: true
      skip_tests:
        description: "Skip tests"
        type: boolean
        default: false
      deploy_android:
        description: "Deploy Android"
        type: boolean
        default: false
      deploy_ios:
        description: "Deploy iOS"
        type: boolean
        default: false
      version_current:
        description: "Current version — no bump (mobile: 1.0)"
        type: boolean
        default: true
      version_patch:
        description: "Bump patch (e.g., 1.0.0 -> 1.0.1)"
        type: boolean
        default: false
      version_minor:
        description: "Bump minor (e.g., 1.0.0 -> 1.1.0)"
        type: boolean
        default: false
      version_major:
        description: "Bump major (e.g., 1.0.0 -> 2.0.0)"
        type: boolean
        default: false
      version_custom:
        description: "Custom version (e.g., 2.0.0-beta1). Overrides all other version options."
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt into Node.js 24 runtime for transitively-used JavaScript actions
  # (e.g. actions/github-script@v7 pulled in by gradle/actions/setup-gradle).
  # See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  version:
    name: Version Bump
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/version-bump.yml
    permissions:
      contents: write
    with:
      module: mobile
      version_current: ${{ inputs.version_current }}
      version_patch: ${{ inputs.version_patch }}
      version_minor: ${{ inputs.version_minor }}
      version_major: ${{ inputs.version_major }}
      version_custom: ${{ inputs.version_custom || '' }}
      is_production: ${{ inputs.environment == 'production' }}
    secrets: inherit

  build-android:
    name: Build Android
    needs: [version]
    if: >-
      !cancelled() &&
      (needs.version.result == 'success' || needs.version.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.build_android)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Set up JBR 21
        uses: actions/setup-java@v5
        with:
          java-version: "21.0.5"
          distribution: "jetbrains"
          token: ${{ github.token }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ !contains(fromJson('["refs/heads/master","refs/heads/develop","refs/heads/staging"]'), github.ref) }}

      - name: Compile Android
        run: ./gradlew :androidApp:compileDebugKotlin --no-daemon
        env:
          APP_ENV: ${{ vars.APP_ENV || 'dev' }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          TODOIST_TOKEN: ${{ secrets.TODOIST_TOKEN }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          SERVER_HOST: ${{ vars.SERVER_HOST }}

  build-ios:
    name: Build iOS
    needs: [version]
    if: >-
      !cancelled() &&
      (needs.version.result == 'success' || needs.version.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.build_ios)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      # iOS uses Temurin instead of JBR: setup-java's JBR distribution
      # resolves releases through GitHub API and macOS runners share egress
      # IPs that hit the unauthenticated rate limit even when a token is
      # passed (the action's auth path is unreliable for the JBR provider).
      # Temurin pulls from Adoptium's CDN so it sidesteps the GitHub API.
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Kotlin/Native (Konan)
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ !contains(fromJson('["refs/heads/master","refs/heads/develop","refs/heads/staging"]'), github.ref) }}

      - name: Compile iOS (Kotlin/Native)
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --no-daemon
        env:
          APP_ENV: ${{ vars.APP_ENV || 'dev' }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          TODOIST_TOKEN: ${{ secrets.TODOIST_TOKEN }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          GRADLE_OPTS: "-Xmx4g"

  test:
    name: Test & Coverage
    needs: [build-android, build-ios]
    if: >-
      !cancelled() &&
      (needs.build-android.result == 'success' || needs.build-android.result == 'skipped') &&
      (needs.build-ios.result == 'success' || needs.build-ios.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || !inputs.skip_tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Set up JBR 21
        uses: actions/setup-java@v5
        with:
          java-version: "21.0.5"
          distribution: "jetbrains"
          token: ${{ github.token }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ !contains(fromJson('["refs/heads/master","refs/heads/develop","refs/heads/staging"]'), github.ref) }}

      - name: Run Shared Tests (JVM)
        run: ./gradlew :shared:jvmTest --no-daemon
        env:
          APP_ENV: ${{ vars.APP_ENV || 'dev' }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          TODOIST_TOKEN: ${{ secrets.TODOIST_TOKEN }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          SERVER_HOST: ${{ vars.SERVER_HOST }}

      - name: Run ComposeApp Tests (JVM)
        run: ./gradlew :composeApp:jvmTest --no-daemon
        env:
          APP_ENV: ${{ vars.APP_ENV || 'dev' }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          TODOIST_TOKEN: ${{ secrets.TODOIST_TOKEN }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          SERVER_HOST: ${{ vars.SERVER_HOST }}

      - name: Generate Coverage Report
        run: ./gradlew koverXmlReport --no-daemon

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/reports/kover/result.xml
          flags: mobile
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  release:
    name: Create Release
    needs: [version, build-android, build-ios, test]
    if: >-
      !cancelled() &&
      needs.version.result == 'success' &&
      needs.version.outputs.version_changed == 'true' &&
      github.event.inputs.environment == 'production' &&
      (needs.build-android.result == 'success' || needs.build-android.result == 'skipped') &&
      (needs.build-ios.result == 'success' || needs.build-ios.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    uses: ./.github/workflows/release.yml
    with:
      module: mobile
      version: ${{ needs.version.outputs.version }}
      previous_tag: ${{ needs.version.outputs.previous_tag }}
      module_paths: "androidApp/ iosApp/ composeApp/ shared/"
    permissions:
      contents: write

  # deploy — not implemented yet
