name: ci-server

on:
  pull_request:
    branches: ["master", "develop", "staging"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options:
          - development
          - test
          - staging
          - production
        default: development
      skip_tests:
        description: "Skip tests"
        type: boolean
        default: false
      deploy:
        description: "Deploy"
        type: boolean
        default: false
      version_current:
        description: "Current version — no bump (server: 1.0.0)"
        type: boolean
        default: true
      version_patch:
        description: "Bump patch (e.g., 1.0.0 -> 1.0.1)"
        type: boolean
        default: false
      version_minor:
        description: "Bump minor (e.g., 1.0.0 -> 1.1.0)"
        type: boolean
        default: false
      version_major:
        description: "Bump major (e.g., 1.0.0 -> 2.0.0)"
        type: boolean
        default: false
      version_custom:
        description: "Custom version (e.g., 2.0.0-beta1). Overrides all other version options."
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  audit:
    name: Dependency Audit
    uses: ./.github/workflows/dependency-audit.yml
    secrets: inherit

  version:
    name: Version Bump
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/version-bump.yml
    permissions:
      contents: write
    with:
      module: server
      version_current: ${{ inputs.version_current }}
      version_patch: ${{ inputs.version_patch }}
      version_minor: ${{ inputs.version_minor }}
      version_major: ${{ inputs.version_major }}
      version_custom: ${{ inputs.version_custom || '' }}
      is_production: ${{ inputs.environment == 'production' }}
    secrets: inherit

  build:
    name: Build Server
    needs: [lint, audit, version]
    if: >-
      !cancelled() &&
      (needs.lint.result == 'success') &&
      (needs.audit.result == 'success') &&
      (needs.version.result == 'success' || needs.version.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ !contains(fromJson('["refs/heads/master","refs/heads/develop","refs/heads/staging"]'), github.ref) }}

      - name: Compile Server
        run: ./gradlew :server:classes --no-daemon
        env:
          APP_ENV: ${{ vars.APP_ENV || 'dev' }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          TODOIST_TOKEN: ${{ secrets.TODOIST_TOKEN }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          SERVER_HOST: ${{ vars.SERVER_HOST }}

  test:
    name: Test & Coverage
    needs: [build]
    if: >-
      !cancelled() &&
      needs.build.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || !inputs.skip_tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ !contains(fromJson('["refs/heads/master","refs/heads/develop","refs/heads/staging"]'), github.ref) }}

      - name: Run Server Tests
        run: ./gradlew :server:test --no-daemon
        env:
          APP_ENV: ${{ vars.APP_ENV || 'dev' }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          TODOIST_TOKEN: ${{ secrets.TODOIST_TOKEN }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          SERVER_HOST: ${{ vars.SERVER_HOST }}

      - name: Generate Coverage Report
        run: ./gradlew :server:koverXmlReport --no-daemon

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: server/build/reports/kover/report.xml
          flags: server
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  code-analysis:
    name: Code Analysis
    needs: [build, test]
    if: >-
      !cancelled() &&
      needs.build.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    uses: ./.github/workflows/code-analysis.yml
    permissions:
      contents: read
      security-events: write

  release:
    name: Create Release
    needs: [version, build, test]
    if: >-
      !cancelled() &&
      needs.version.result == 'success' &&
      needs.version.outputs.version_changed == 'true' &&
      github.event.inputs.environment == 'production' &&
      needs.build.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    uses: ./.github/workflows/release.yml
    with:
      module: server
      version: ${{ needs.version.outputs.version }}
      previous_tag: ${{ needs.version.outputs.previous_tag }}
      module_paths: "server/ shared/"
    permissions:
      contents: write

  # deploy — not implemented yet
