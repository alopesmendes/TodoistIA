name: lint

on:
  workflow_call:
    inputs:
      java-version:
        description: "JDK major version to set up"
        required: false
        type: string
        default: "17"
      gradle-task:
        description: "Gradle task to invoke for linting"
        required: false
        type: string
        default: "lintCheck"
      continue-on-error:
        description: "Pass --continue to Gradle so all modules are linted before failing"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      java-version:
        description: "JDK major version to set up"
        required: false
        type: string
        default: "17"
      gradle-task:
        description: "Gradle task to invoke for linting"
        required: false
        type: string
        default: "lintCheck"
      continue-on-error:
        description: "Pass --continue to Gradle"
        required: false
        type: boolean
        default: false

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ktlint Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ !contains(fromJson('["refs/heads/master","refs/heads/develop","refs/heads/staging"]'), github.ref) }}

      - name: Run ktlint check
        run: ./gradlew ${{ inputs.gradle-task }} --no-daemon ${{ inputs.continue-on-error && '--continue' || '' }}

      - name: Upload ktlint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-reports
          path: "**/build/reports/ktlint/"
          retention-days: 14
          if-no-files-found: ignore