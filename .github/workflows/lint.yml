name: lint

on:
  workflow_call:
    inputs:
      java-version:
        description: "JDK version (pin to specific build for deterministic CI)"
        required: false
        type: string
        default: "21.0.5"
      gradle-task:
        description: "Gradle task to invoke for linting"
        required: false
        type: string
        default: "lintCheck"
      continue-on-error:
        description: "Pass --continue to Gradle so all modules are linted before failing"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      java-version:
        description: "JDK version (pin to specific build for deterministic CI)"
        required: false
        type: string
        default: "21.0.5"
      gradle-task:
        description: "Gradle task to invoke for linting"
        required: false
        type: string
        default: "lintCheck"
      continue-on-error:
        description: "Pass --continue to Gradle"
        required: false
        type: boolean
        default: false

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  # Opt into Node.js 24 runtime for transitively-used JavaScript actions
  # (e.g. actions/github-script@v7 pulled in by gradle/actions/setup-gradle).
  # See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Ktlint Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: "jetbrains"
          token: ${{ github.token }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ !contains(fromJson('["refs/heads/master","refs/heads/develop","refs/heads/staging"]'), github.ref) }}

      - name: Run ktlint check
        run: ./gradlew ${{ inputs.gradle-task }} --no-daemon ${{ inputs.continue-on-error && '--continue' || '' }}

      - name: Upload ktlint reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ktlint-reports
          path: "**/build/reports/ktlint/"
          retention-days: 14
          if-no-files-found: ignore
