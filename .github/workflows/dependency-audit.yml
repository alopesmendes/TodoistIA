name: dependency-audit

on:
  workflow_call:
  pull_request:
    branches: [ "master", "develop", "staging" ]
  push:
    branches: [ "master", "develop", "staging" ]
  schedule:
    # Every Sunday at 02:00 UTC to catch newly disclosed CVEs
    - cron: "0 2 * * 0"

concurrency:
  group: dependency-audit-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  # Opt into Node.js 24 runtime for transitively-used JavaScript actions
  # (e.g. actions/github-script@v7 pulled in by gradle/actions/setup-gradle).
  # See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JBR 21
        uses: actions/setup-java@v5
        with:
          java-version: "21.0.5"
          distribution: "jetbrains"
          token: ${{ github.token }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ !contains(fromJson('["refs/heads/master","refs/heads/develop","refs/heads/staging"]'), github.ref) }}

      - name: Cache NVD database
        uses: actions/cache@v5
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            nvd-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        run: ./gradlew dependencyCheckAnalyze --no-daemon
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-report-${{ github.run_number }}
          path: build/reports/
          retention-days: 30

  freshness:
    name: Dependency Freshness Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run on schedule — not blocking PRs or CI calls
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JBR 21
        uses: actions/setup-java@v5
        with:
          java-version: "21.0.5"
          distribution: "jetbrains"
          token: ${{ github.token }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run dependency updates check
        # gradle-versions-plugin is not compatible with Gradle configuration cache
        # (invokes Task.project at execution time). Disable config cache for this task only.
        run: ./gradlew dependencyUpdates --no-daemon --no-configuration-cache

      - name: Upload freshness report
        uses: actions/upload-artifact@v7
        with:
          name: dependency-freshness-report-${{ github.run_number }}
          path: build/reports/dependencyUpdates/
          retention-days: 30
